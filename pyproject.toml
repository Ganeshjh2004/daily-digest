[build-system]
requires = ["setuptools>=75.8.0,<76.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-digest"
version = "0.1.0"
description = "A static daily AI and technology news digest"
requires-python = ">=3.11"
dependencies = [
  "feedparser==6.0.11",
  "httpx==0.28.1",
  "langchain-core>=0.3.86,<1.0",
  "langchain-groq==0.3.7",
  "langgraph==0.6.6",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==0.24.0",
  "respx==0.22.0",
  "ruff==0.12.8",
]

[project.scripts]
daily-digest = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

