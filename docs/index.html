<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https: data:; style-src 'self'; script-src 'self'; connect-src 'self' https://api.github.com; base-uri 'none'; form-action 'none'"
    >
    <title>Daily Digest</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div class="brand">
          <span class="brand-logo" aria-hidden="true" id="brand-icon"></span>
          <div>
            <h1>Daily Digest</h1>
            <p>Curated AI &amp; Tech news for you</p>
          </div>
        </div>
        <label class="search" for="search-input">
          <span aria-hidden="true" id="search-icon"></span>
          <span class="sr-only">Search articles, topics, and sources</span>
          <input id="search-input" type="search" placeholder="Search articles, topics..." autocomplete="off">
        </label>
        <span class="avatar" aria-label="User">U</span>
      </div>
    </header>
    <main id="app" class="app-shell" aria-live="polite"></main>
    <script type="module" src="app.js"></script>
  </body>
</html>
